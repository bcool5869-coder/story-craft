<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Story Craft: a storytelling course</title>
  <meta name="description" content="A free storytelling course with a small AI writing partner that runs in your browser.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📖</text></svg>">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <a href="#/" class="brand">📖 Story Craft</a>
    <button id="ai-status" type="button" class="pill">AI: not loaded</button>
  </header>

  <main id="main"></main>

  <footer class="site-footer">
    <p>Free course · AI by <a href="https://huggingface.co/openbmb">MiniCPM5</a> running on
      <a href="https://github.com/ngxson/wllama">wllama</a> in your browser.</p>
  </footer>

  <dialog id="model-dialog">
    <h2>Load an AI writing partner</h2>
    <p>The model downloads once and then runs on your own device. Nothing you write is sent anywhere.</p>
    <div id="model-options"></div>
    <div class="actions"><button id="model-close" type="button">Close</button></div>
  </dialog>

  <noscript>This course needs JavaScript enabled.</noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
